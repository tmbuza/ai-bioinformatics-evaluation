project:
  type: book
  output-dir: docs

bibliography: library/references.bib
date: 2026-10-08
date-format: "MMM YYYY"

book:
  title: "Evaluating AI-Assisted Bioinformatics Analyses"
  subtitle: "Scientific reasoning, reproducibility, and evidence-based feedback"
  author: "Complex Data Insights"
  site-url: https://ai-bioinformatics.complexdatainsights.com/

  chapters:
    - index.qmd
    - 00-preface.qmd
    - part: "Evaluation Foundations"
      chapters:
        - 01-orientation.qmd
        - 02-evaluation-framework.qmd
        - 03-reproducible-verification.qmd
    - part: "Original Case Studies"
      chapters:
        - 04-rnaseq-case.qmd
        - 05-microbiome-case.qmd
        - 06-singlecell-case.qmd
    - part: "Independent Practice"
      chapters:
        - 07-independent-evaluation.qmd
        - 08-next-steps.qmd
  appendices:
    - 99-appendix.qmd
    - 99-references.qmd


format:
  html:
    toc: true
    toc-depth: 3
    number-sections: false
    number-depth: 2
    smooth-scroll: true
    anchor-sections: true
    link-external-icon: true
    css: assets/css/cdi.css
    code-fold: true
    mermaid:
      theme: forest

execute:
  echo: true
  warning: false
  message: false
  freeze: auto
  working-dir: .

